[package]
name = "nucleo-f446ze"
description = "Nucleo-F446ZE board crate for CapletRT (STM32F446ZE)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
cortex-m-semihosting = { workspace = true }
caplet-hal = { path = "../../crates/caplet-hal" }
caplet-hal-stm32f4 = { path = "../../crates/caplet-hal-stm32f4" }
caplet-cortex-m = { path = "../../ports/cortex-m" }
caplet-log = { path = "../../crates/caplet-log", features = ["semihosting"] }
caplet-macros = { path = "../../crates/caplet-macros" }
embedded-alloc = "0.5"
critical-section = { version = "1.1", features = ["restore-state-u32"] }

[[bin]]
name = "nucleo-f446ze"
path = "src/main.rs"
required-features = ["target-none"]

[features]
default = []
# See hello-qemu-cm4 for the rationale.
target-none = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"