[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
runner = "qemu-system-riscv32 -machine virt -cpu rv32 -nographic -m 128M -bios none -kernel"
linker = "rust-lld"

[target.riscv64gc-unknown-none-elf]
runner = "qemu-system-riscv64 -machine virt -cpu rv64 -nographic -m 128M -bios none -kernel"
linker = "rust-lld"
