[package]
name = "hello-riscv"
description = "Minimal hello-world for RISC-V (QEMU virt / Renode riscv_virt)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
caplet-riscv = { path = "../../ports/riscv", default-features = false }

[features]
default = []
target-none = []
rv32imac = ["caplet-riscv/rv32imac"]
rv64gc = ["caplet-riscv/rv64gc"]

[[bin]]
name = "hello-riscv"
path = "src/main.rs"
required-features = ["target-none"]
test = false
