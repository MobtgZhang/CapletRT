[package]
name = "automotive"
description = "Automotive demo: CAN bus, IEEE 802.1AS time sync, fault recording (black box)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
caplet-cortex-m = { path = "../../ports/cortex-m", features = ["cortex_m4"] }
caplet-kernel = { path = "../../crates/caplet-kernel" }
caplet-log = { path = "../../crates/caplet-log", features = ["semihosting"] }
caplet-macros = { path = "../../crates/caplet-macros" }
caplet-macros-exports = { path = "../../crates/caplet-macros-exports" }
caplet-async = { path = "../../crates/caplet-async" }
caplet-sync = { path = "../../crates/caplet-sync" }
caplet-sensors = { path = "../../crates/caplet-sensors" }
heapless = "0.8"
libm = "0.2"
cortex-m-rt.workspace = true
cortex-m-semihosting.workspace = true

[features]
default = []
target-none = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
