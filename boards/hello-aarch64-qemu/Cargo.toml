[package]
name = "hello-aarch64-qemu"
description = "Minimal AArch64 hello board for QEMU virt and Renode Cortex-A53"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
caplet-aarch64 = { path = "../../ports/aarch64" }

[features]
default = []
target-none = []

[[bin]]
name = "hello-aarch64-qemu"
path = "src/main.rs"
required-features = ["target-none"]
test = false
