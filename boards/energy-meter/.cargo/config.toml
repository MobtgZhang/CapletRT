[target.thumbv7em-none-eabihf]
runner = "qemu-system-arm -machine mps2-an500 -cpu cortex-m4 -nographic -semihosting-config enable=on,target=native -kernel"

[target.riscv32imac-unknown-none-elf]
runner = "qemu-system-riscv32 -machine virt -cpu rv32 -nographic -m 128M -bios none -kernel"
linker = "rust-lld"

[target.riscv64gc-unknown-none-elf]
runner = "qemu-system-riscv64 -machine virt -cpu rv64 -nographic -m 128M -bios none -kernel"
linker = "rust-lld"
