name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests, lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features -- --nocapture
      - name: Compile benchmarks
        run: cargo bench --no-run --workspace

  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: HAL version gate
        run: bash tools/hal_version_gate.sh
      - name: Forbidden-token and SAFETY-comment grep gate
        run: bash tools/grep_gate.sh

  cargo-deny:
    name: cargo-deny licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run deny (strict)
        run: cargo deny check

  kani:
    name: Kani catalogue (49 proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo-kani setup
      - name: Run every proof individually
        run: bash tools/kani/run_catalogue.sh | tee kani-catalogue.log
      - name: Upload Kani log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-catalogue.log
          path: kani-catalogue.log

  qemu-matrix:
    name: QEMU matrix (22 boards)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi,thumbv7em-none-eabihf,armv7a-none-eabihf,aarch64-unknown-none,riscv32imac-unknown-none-elf,riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc
      - name: Run matrix
        run: |
          SIM_TIMEOUT=15 bash tools/sim/run_matrix.sh | tee qemu-matrix.log
          grep -Fq 'PASS: QEMU matrix (22 boards)' qemu-matrix.log
      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-matrix-logs
          path: |
            qemu-matrix.log
            target/sim/**/qemu.log

  renode-matrix:
    name: Renode matrix (22 boards)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi,thumbv7em-none-eabihf,armv7a-none-eabihf,aarch64-unknown-none,riscv32imac-unknown-none-elf,riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Install Renode portable release
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          curl -fsSL https://api.github.com/repos/renode/renode/releases/latest -o renode-release.json
          url=$(jq -r '.assets[] | select(.name | endswith(".linux-portable.tar.gz")) | .browser_download_url' renode-release.json | head -n1)
          test -n "$url"
          curl -fsSL "$url" -o renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode.tar.gz -C "$HOME/renode"
          bin=$(find "$HOME/renode" -type f -name renode -perm -u+x | head -n1)
          test -n "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version
      - name: Run matrix
        run: |
          SIM_TIMEOUT=60 bash tools/sim/renode_matrix.sh | tee renode-matrix.log
          grep -Fq 'PASS: Renode matrix (22 boards)' renode-matrix.log
      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-matrix-logs
          path: |
            renode-matrix.log
            target/sim/**/renode.log

  gdb:
    name: GDB breakpoint validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7a-none-eabihf,aarch64-unknown-none,riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU and multiarch GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc gdb-multiarch
      - name: RISC-V 64 breakpoint
        run: |
          GDB_BATCH=1 GDB=gdb-multiarch tools/sim/gdb_debug.sh riscv64 \
            -ex 'break rust_main' -ex 'continue' -ex 'info registers pc' \
            | tee gdb-riscv64.log
          grep -Fq 'Breakpoint 1,' gdb-riscv64.log
      - name: AArch64 breakpoint
        run: |
          GDB_BATCH=1 GDB=gdb-multiarch tools/sim/gdb_debug.sh aarch64 \
            -ex 'break rust_main' -ex 'continue' -ex 'info registers pc' \
            | tee gdb-aarch64.log
          grep -Fq 'Breakpoint 1,' gdb-aarch64.log
      - name: ARMv7-A breakpoint
        run: |
          GDB_BATCH=1 GDB=gdb-multiarch tools/sim/gdb_debug.sh cortex-a9 \
            -ex 'break boot_main' -ex 'continue' -ex 'info registers pc' \
            | tee gdb-cortex-a9.log
          grep -Fq 'Breakpoint 1,' gdb-cortex-a9.log

  e2e:
    name: Specialized end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi,thumbv7em-none-eabihf,armv7a-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc clang python3
      - name: Cortex-A9 SMP smoke (2 and 4 cores)
        run: bash tests/qemu-smp-smoke/run.sh
      - name: Industrial MQTT-SN E2E
        run: bash tests/industrial-e2e/run.sh
      - name: Tickless verification
        run: bash tools/tickless_verify.sh
      - name: Dynamic loader E2E
        run: bash tests/dynamic-loader-e2e/run.sh
      - name: OTA E2E
        run: cargo test -p caplet-ota --test e2e
