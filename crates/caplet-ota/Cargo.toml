[package]
name = "caplet-ota"
description = "OTA update manager and secure boot for CapletRT (M4 milestone)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
caplet-security = { path = "../caplet-security" }
caplet-crypto = { path = "../caplet-crypto" }
caplet-cap = { path = "../caplet-cap" }
caplet-sync = { path = "../caplet-sync" }

[features]
default = []
# Kept as a compatibility feature: Ed25519 and SHA-256 are always linked in
# through rustcrypto/ed25519-dalek.  No firmware update path may silently
# disable authentication.
crypto = []

[dev-dependencies]
ed25519-dalek.workspace = true
