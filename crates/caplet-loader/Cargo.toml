[package]
name = "caplet-loader"
description = "Dynamic module loader for CapletRT (M3 — ELF subset + .capp + signature verification)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
caplet-cap = { path = "../caplet-cap" }
caplet-sync = { path = "../caplet-sync" }
caplet-crypto = { path = "../caplet-crypto" }

[features]
default = ["crypto"]
# Enable real Ed25519 signature verification for .capp modules.
crypto = []
# Enable the bounded in-memory audit ring in `metrics.rs`.
metrics_ring = []

[dev-dependencies]
caplet-bench-harness = { path = "../caplet-bench-harness" }
ed25519-dalek.workspace = true

[lib]
path = "src/lib.rs"

[[bench]]
name = "loader_throughput"
harness = false
