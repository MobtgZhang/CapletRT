# cargo-deny configuration for CapletRT.
#
# This file is intentionally permissive for an M2 demo: we
# only forbid GPL-3.0+ (which is incompatible with our target
# dual-license) and crates with unknown licenses. Anything
# else is allowed.
#
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
version = 2
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []